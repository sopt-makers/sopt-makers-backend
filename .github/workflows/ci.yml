name: Continuous Integration for SOPT Makers Backend

on:
  pull_request:
    branches: [ develop, prod ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 🧱 Build
        run: ./gradlew clean build --no-daemon --no-build-cache
