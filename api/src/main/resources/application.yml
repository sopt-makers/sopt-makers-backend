spring:
  config:
    import:
      - classpath:storage.yml
      - classpath:security.yml
      - classpath:external.yml

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: ${ACTUATOR_PATH}

admin:
  key: ${ADMIN_KEY:}

auth:
  bypass-login:
    phone: ${BYPASS_LOGIN_PHONE}
    code: ${BYPASS_LOGIN_CODE}
    name: ${BYPASS_LOGIN_NAME}

official:
  apikey: ${OFFICIAL_API_KEY:}

crew:
  apikey: ${CREW_API_KEY:}
  slack:
    api-auth-token: ${SLACK_API_AUTH_TOKEN:}

sopt:
  current:
    generation: ${SOPT_CURRENT_GENERATION}
  soptamp:
    admin:
      password: ${SOPTAMP_ADMIN_PASSWORD}
    appjam-mode: ${SOPTAMP_APPJAM_MODE:false}
    scheduler:
      rank-reload:
        enabled: ${SOPTAMP_RANK_RELOAD_SCHEDULER_ENABLED:false}
      upsert:
        enabled: ${SOPTAMP_UPSERT_SCHEDULER_ENABLED:false}
