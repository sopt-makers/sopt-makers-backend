external:
  oauth:
    apple:
      web-aud: ${APPLE_OAUTH_WEB_AUD}
      app-aud: ${APPLE_OAUTH_APP_AUD}
    google:
      client:
        id: ${GOOGLE_OAUTH_CLIENT_ID}
  sms:
    gabia:
      sms-id: ${GABIA_SMS_ID}
      api-key: ${GABIA_API_KEY}
      sender-number: ${GABIA_SENDER_NUMBER}
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION}
    base-dir: ${S3_BASE_DIR}
  playground:
    url: ${PLAYGROUND_URL}
    token: ${PLAYGROUND_TOKEN}
  alarm:
    url: ${ALARM_NOTIFICATION_URL}
    key: ${ALARM_NOTIFICATION_KEY}
    arn: ${ALARM_NOTIFICATION_ARN}
    header-service: operation
    app-header-service: app
  eventbridge:
    role-arn: ${AWS_EVENTBRIDGE_ROLE_ARN}
    region: ${AWS_REGION}
  auth:
    url: ${AUTH_API_URL}
    api-key: ${AUTH_API_KEY}
    service-name: ${AUTH_SERVICE_NAME}
  crew:
    url: ${CREW_API_URL}
